name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DataTaxi-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DataTaxi-debug-apk
          path: DataTaxi-debug.apk

      # Lien de téléchargement direct, pratique depuis la tablette (onglet Releases du dépôt).
      - name: Publish latest APK as a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: DataTaxi - dernière version de test
          prerelease: true
          files: DataTaxi-debug.apk

      # Version de test de la branche en cours : lien direct sans compte, même hors main.
      - name: Publish branch APK as a test release
        if: github.ref == 'refs/heads/feature/journal-ecrans'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-journal-ecrans
          name: DataTaxi - version de test (journal des écrans + avatar)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: DataTaxi-debug.apk
