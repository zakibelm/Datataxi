name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Unit tests (dates et doublons)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Captures d'écran de l'interface
        run: gradle recordPaparazziDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DataTaxi-captures-ecran
          path: app/src/test/snapshots/images/

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DataTaxi-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DataTaxi-debug-apk
          path: DataTaxi-debug.apk

      # Lien de téléchargement direct, pratique depuis la tablette (onglet Releases du dépôt).
      - name: Publish latest APK as a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: DataTaxi - dernière version de test
          prerelease: true
          files: DataTaxi-debug.apk

  # Démarrage réel sur un émulateur Android : mise à jour depuis la v0.6.1 avec un journal à doublons.
  demarrage:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DataTaxi-debug-apk

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Démarrage sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/scripts/demarrage.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DataTaxi-demarrage-emulateur
          path: demarrage/

      # Publication seulement si l'application démarre sans planter sur l'émulateur.
      - name: Publish branch APK as a test release
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: version-de-test
          name: DataTaxi - version en cours de test (branche de travail)
          prerelease: true
          files: DataTaxi-debug.apk
